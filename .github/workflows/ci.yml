name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [framework, ff3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare the MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check ninja
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "Visual Studio C++ toolset not found" }
          $bat = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }
      - name: Audit published files
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 tools/check_repository.py
          else
            python tools/check_repository.py
          fi
      - name: Configure
        shell: bash
        run: |
          profile="${{ matrix.profile }}"
          if [ "$profile" = framework ]; then profile=""; fi
          generator=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            generator=(-G Ninja)
          fi
          cmake -S . -B out/ci "${generator[@]}" -DCMAKE_BUILD_TYPE=Release -DPSPRECOMP_PROFILE="$profile" -DFF3_BUILD_GENERATED=OFF -DFF3_BUILD_WINDOW=OFF
      - name: Build
        run: cmake --build out/ci --parallel 2
      - name: Test
        run: ctest --test-dir out/ci --output-on-failure
